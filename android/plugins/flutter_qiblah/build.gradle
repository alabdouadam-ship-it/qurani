plugins {
    id 'com.android.library'
}

android {
    namespace 'ml.medyas.flutter_qiblah'
    compileSdk 36
    defaultConfig { minSdk 16 }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main {
        def sources = gradle.ext.qiblaPluginSources[project.name]
        manifest.srcFile(new File(sources, 'AndroidManifest.xml'))
        kotlin.srcDir(new File(sources, 'kotlin'))
    }
}
