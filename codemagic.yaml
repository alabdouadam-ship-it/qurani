workflows:
  ios-workflow:
    name: Qurani iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.qurani.ios
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        SUPABASE_URL: "https://zqqqipzbkkrgpdnzliyg.supabase.co"
        SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxcXFpcHpia2tyZ3BkbnpsaXlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTk0NzAsImV4cCI6MjA5NjE3NTQ3MH0.8EGTsoHwT2bwCdHN61vofryOXTjmyNTk9jVXTa-8Ku8"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build release IPA with Supabase config
        script: |
          bash tool/build_release.sh ipa --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - alabdouadam@gmail.com
        notify:
          success: true
          failure: true
