name: qurani
description: >
  Qurani is a comprehensive Islamic companion app featuring the complete Holy Quran with multiple translations,
  accurate prayer times with customizable Adhan notifications, Qibla direction finder, Tasbeeh counter,
  memorization tools, and audio recitations. Designed for Muslims worldwide with support for Arabic, English,
  and French languages. All Quran text and core features work offline.

publish_to: 'none'

version: 1.0.14+59
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Core Utilities ---
  package_info_plus: ^9.0.0
  device_info_plus: ^12.2.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1  
  
  # --- Audio & Background ---
  just_audio: ^0.10.6          
  just_audio_background: ^0.0.1-beta.17 
  # 0.2.x compiles out the iOS microphone code by default. Nothing in this app
  # records, and Info.plist deliberately carries no NSMicrophoneUsageDescription,
  # so that default is the one we want. Set AUDIO_SESSION_MICROPHONE=1 in the
  # Podfile if recording is ever added.
  audio_session: ^0.2.4

  # --- Database & Storage ---
  sqflite: ^2.3.3
  path: ^1.9.0

  # --- UI & Icons ---
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  in_app_update: ^4.2.2
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0
  pdfrx: ^2.2.18 
  wakelock_plus: ^1.2.8

  # --- Notifications & Alarms ---
  flutter_local_notifications: ^18.0.1 
  android_alarm_manager_plus: ^5.0.0
  timezone: ^0.9.2
  flutter_timezone: ^5.0.1

  # --- Network & Tools ---
  dio: ^5.4.0
  url_launcher: ^6.3.1
  share_plus: ^12.0.1
  uuid: ^4.5.2
  screenshot: ^3.0.0
  # [FIXED] Updated to match your Flutter SDK requirement
  intl: ^0.20.2                
  pdf: ^3.10.7
  geocoding: ^2.1.1
  flutter_qiblah: ^3.1.0+1
  cached_network_image: ^3.3.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  geolocator: ^13.0.4
  http: ^1.5.0
  web: ^1.1.1

  json_annotation: ^4.8.1
  supabase_flutter: ^2.14.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.0        
  sqlite3: ^2.4.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4
  # Used only by tool/check_16kb_alignment.dart to read .so entries out of a
  # built .aab/.apk. Already present transitively; declared here so the tool
  # imports a package this project actually depends on.
  archive: ^4.0.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    # NOTE: the Quran edition JSONs are deliberately NOT listed here.
    # They are a WEB-ONLY data source: on io (Android/iOS) every edition is
    # read from the bundled `assets/data/quran.db` via `QuranEdition.dbColumn`,
    # so bundling the JSONs too would ship ~105 MB of dead weight to mobile.
    # They live at the repo root in `data/editions/` -- deliberately NOT under
    # `assets/` (which would bundle them into mobile) and NOT under `web/`
    # (which `flutter build web` copies wholesale into `build/web`, putting
    # 193 MB on Firebase Hosting every deploy). They are served to the web app
    # from GitHub via jsDelivr instead, which costs no Hosting bandwidth.
    # See `QuranEdition.webDataDir`, `web_edition_json.dart`, and
    # `tool/shard_editions.dart`.
    # Listed file-by-file on purpose. A bare `- assets/data/` entry would also
    # ship the 104 MB unsplit `assets/data/quran.db`, which is kept in the repo
    # ONLY as the source for tool/pack_quran_db.dart. What ships is
    # `assets/data/quran_db/` -- the same database gzipped and split into ~8 MB
    # parts, so QuranDatabaseService can stream it out of the bundle instead of
    # allocating 104 MB in one go on first launch. Shipping both would double
    # the download for nothing.
    - assets/data/hadithdata/
    - assets/data/quran_db/
    - assets/data/reciters.json
    - assets/audio/
    - assets/images/
    - public/
  fonts:
      - family: Amiri Quran
        fonts:
          - asset: assets/fonts/AmiriQuran-Regular.ttf
      - family: KFGQPCHafsSmall
        fonts:
          - asset: assets/fonts/KfgqpcHafsUthmanicScriptRegular-nARZ1.ttf
      - family: KFGQPCHafsLarge
        fonts:
          - asset: assets/fonts/KfgqpcHafsUthmanicScriptRegular-1jGEe.ttf
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
